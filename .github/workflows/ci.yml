name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node20:
    name: Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  node22:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
